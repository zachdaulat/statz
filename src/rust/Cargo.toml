[package]
name = 'statz'
publish = false
version = '0.1.2'
edition = '2021'
rust-version = '1.75'

[lib]
crate-type = [ 'rlib', 'staticlib' ]
name = 'statz'

[[bin]]
name = 'document'
path = 'document.rs'

[dependencies]
extendr-api = "0.9.0"
faer = "0.24.4"
libm = "0.2.16"
rand = "0.10.2"
rand_chacha = "0.10.0"

[profile.release]
lto = true
codegen-units = 1
